services:
  sso-service:
    image: sso-service:v1.0
    container_name: sso_service_container
    build: .
    volumes:
      - .:/usr/src/app            # Sync your local code to the container
      - /usr/src/app/node_modules # Prevent local node_modules from overwriting container's
    env_file:
      - .env
    ports:
      - "${PORT}:${PORT}" # Passes the .env PORT to docker PORT
    networks:
      - internal_db_network
    
    # will overwrite the same variables found in your .env file
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
networks:
  internal_db_network:
    external: true
  notification-service_default:
    external: true